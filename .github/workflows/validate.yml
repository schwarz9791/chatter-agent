name: Validate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# 既定のトークン権限は広いので、必要な分だけに絞る
permissions:
  contents: read

# 同じブランチへ続けて push したら、古い実行は打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: core

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run oxlint
        run: npm run lint

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  notice:
    name: NOTICE is consistent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify plugin license files exist
        run: |
          for f in ../plugin/LICENSE ../plugin/NOTICE; do
            if [ ! -f "$f" ]; then
              echo "::error::$f がありません。/plugin install の配布物に含める必要があります。"
              exit 1
            fi
          done

      # 同梱コピーは消せない（.app / .apk に通知を同梱するため）。
      # 一致は EditMode テスト（NoticeTests）も見ているが、このワークフローに Unity ジョブが無いので
      # ズレたままマージできてしまう。**古いライセンス表記が出荷される**ので、ここでも落とす
      - name: Verify bundled NOTICE matches the repository NOTICE
        run: |
          copy=../chatter-mascot/Assets/StreamingAssets/NOTICE.txt
          if ! diff -q ../NOTICE "$copy"; then
            echo "::error::同梱の NOTICE.txt がリポジトリの NOTICE とズレています。cp NOTICE chatter-mascot/Assets/StreamingAssets/NOTICE.txt で合わせてください。"
            diff -u ../NOTICE "$copy" || true
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

  verify:
    name: Verify (phase A / B)
    runs-on: ubuntu-latest

    # phase-a / phase-b はどちらもバンドル（core/dist/）を実行するので
    # npm run build が先に要る。phase-b は 127.0.0.1:18570 に bind するだけなので CI でも動く
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Ollaya の感情判定の子は同じバンドルの隠しサブコマンドで起こされる。
      # 接続できない先でも、失敗を `[null]` で返して終わること
      - name: Verify Ollaya child starts from the bundle
        run: |
          out="$(printf '%s' '{"texts":["x"],"baseUrl":"http://127.0.0.1:9","model":"m"}' | node dist/chatter-agent-speak.mjs ollaya-child)"
          if [ "$out" != "[null]" ]; then
            echo "::error::バンドルから Ollaya の子が起動できません: $out"
            exit 1
          fi

      - name: Verify phase A (spool → speech.jsonl)
        run: npm run verify:phase-a

      - name: Verify phase B (delivery queue → WebSocket)
        run: npm run verify:phase-b

      # 合成エンジンはスタブ HTTP に差し替わるので AivisSpeech は要らない
      - name: Verify TTS (server の合成と GET /audio/)
        run: npm run verify:tts

      # 音声は上と同じくスタブ、再生コマンドは fake-player.mjs に差し替わるので、
      # AivisSpeech もオーディオデバイスも要らない
      - name: Verify player (WebSocket → 音声取得 → 再生 → ack)
        run: npm run verify:player

      # 素材は使い捨ての XDG_CONFIG_HOME に仕込むので、モデルも合成エンジンも要らない
      - name: Verify assets (マニフェスト → GET /v1/assets/ → Range で再開)
        run: npm run verify:assets

  bun:
    name: Bun（単体テスト / verify）
    runs-on: ubuntu-latest

    # 依存の解決とビルドは Node、テストと verify だけ Bun で回す。
    # phase-a は hook と検証スクリプトが PATH の `node` を呼ぶので、`bun` を exec する `node` を
    # PATH の先頭に置いて Bun で動かす（`bun --bun run` が差し替える `node` は、`node -e` の後ろの
    # 1つ目の引数を落とす）。
    # 他の verify は harness が process.execPath で子を起こすので、server / CLI / player も Bun になる
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: core/package-lock.json

      # mise.toml の bun と揃えること
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests on Bun
        run: bunx --bun vitest run

      - name: Verify phase A on Bun
        run: |
          mkdir -p "$RUNNER_TEMP/node-shim"
          printf '#!/bin/sh\nexec bun "$@"\n' > "$RUNNER_TEMP/node-shim/node"
          chmod +x "$RUNNER_TEMP/node-shim/node"
          PATH="$RUNNER_TEMP/node-shim:$PATH" bash scripts/verify-phase-a.sh

      - name: Verify phase B on Bun
        run: bun --bun run verify:phase-b

      - name: Verify TTS on Bun
        run: bun --bun run verify:tts

      - name: Verify player on Bun
        run: bun --bun run verify:player

      - name: Verify assets on Bun
        run: bun --bun run verify:assets

      # 単一バイナリに入る npm パッケージは、配布物に NOTICE で表記する義務がある。
      # 依存が増えて NOTICE に載せ忘れるのをここで止める。
      # パッケージ名はパスの最後の node_modules/ の後ろから取る（入れ子に置かれた別の版を親の名前で数えないため）
      - name: Verify bundled packages are in NOTICE
        run: |
          notice=../NOTICE
          packages="$(bun build src/main.ts --target=bun | grep -oE '^// node_modules/[^ ]+' | sed -E 's#^.*node_modules/((@[^/]+/)?[^/]+).*#\1#' | sort -u)"
          if [ -z "$packages" ]; then
            echo "::error::バンドルから npm パッケージを拾えませんでした。このステップの抽出を確認してください。"
            exit 1
          fi
          status=0
          for pkg in $packages; do
            if ! grep -qF -- "- $pkg (" "$notice"; then
              echo "::error::$pkg が NOTICE にありません。単一バイナリに入るので、著作権表示とライセンス全文を足してください。"
              status=1
            fi
          done
          exit $status

      # 単一バイナリ（chatter-agent）にして、同じ verify を通す
      - name: Compile single binary
        run: npm run compile -- --outfile "$RUNNER_TEMP/chatter-agent"

      - name: Verify Ollaya child starts from binary
        run: |
          out="$(printf '%s' '{"texts":["x"],"baseUrl":"http://127.0.0.1:9","model":"m"}' | "$RUNNER_TEMP/chatter-agent" ollaya-child)"
          if [ "$out" != "[null]" ]; then
            echo "::error::単一バイナリから Ollaya の子が起動できません: $out"
            exit 1
          fi

      - name: Verify phase B on binary
        run: CHATTER_AGENT_BIN="$RUNNER_TEMP/chatter-agent" bun --bun run verify:phase-b

      - name: Verify player on binary
        run: CHATTER_AGENT_BIN="$RUNNER_TEMP/chatter-agent" bun --bun run verify:player

  agent-app:
    name: ChatterAgent
    runs-on: macos-latest

    # ChatterAgent は macOS 常駐アプリ（Tauri）。tray と LaunchAgent を使うので macOS で回す。
    # ここで見るのは設定画面（TypeScript）と Rust のコードだけで、.app のビルドと実機の挙動は見ない
    defaults:
      run:
        working-directory: chatter-agent-app/src-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: chatter-agent-app/package-lock.json

      # 設定画面は core の設定キーの型を import type で引くので、core を直したときの食い違いもここで落ちる
      - name: Install web dependencies
        working-directory: chatter-agent-app
        run: npm ci

      - name: Build web
        working-directory: chatter-agent-app
        run: npm run build:web

      - name: Test web
        working-directory: chatter-agent-app
        run: npm test

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: chatter-agent-app/src-tauri

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      # 版は chatter-agent-app/mise.toml の cargo-about と揃える
      - name: Install cargo-about
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2

      - name: THIRD_PARTY_LICENSES.txt が Cargo.lock と一致すること
        working-directory: chatter-agent-app
        run: |
          npm run licenses
          if ! git diff --exit-code -- src-tauri/THIRD_PARTY_LICENSES.txt; then
            echo "::error file=chatter-agent-app/src-tauri/THIRD_PARTY_LICENSES.txt::Cargo.lock を変えたら chatter-agent-app で npm run licenses を実行して生成し直し、THIRD_PARTY_LICENSES.txt をコミットしてください"
            exit 1
          fi

  unity-audio-settings:
    name: Unity のオーディオ設定が出荷値
    runs-on: ubuntu-latest

    # scripts/build.sh は macOS ビルドのあいだだけ Disable Unity Audio を ON にして戻す
    # （Unity 内蔵オーディオが有効なままだと、AudioSource を1つも鳴らさなくても
    # 出力デバイスを掴み続けるため）。BuildScript の finally と build.sh の trap で戻しているが、
    # SIGKILL はどちらでも拾えない。ON が残ったままコミットされると、次の Android ビルドは
    # Unity 内蔵オーディオごと無効 → AudioClipPlayer が鳴らない → isPlaying が即 false →
    # 全部 ack されてサーバーのキューから消える。ここが最後の砦。
    steps:
      # ★ **lfs: true は要らない。** #56 で Assets/StreamingAssets/ に LFS 追跡の
      # .vrm / .vrma が入ったが、このジョブが読むのは YAML の .asset だけで、
      # LFS のポインタファイルのままでも grep は成立する。
      # **Unity Editor を起動するジョブ（#54）を足すときは lfs: true が要る** ——
      # ポインタファイルのままだとモデルの読み込みが必ず失敗する。
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: m_DisableAudio が出荷値（0）であること
        working-directory: .
        run: |
          asset=chatter-mascot/ProjectSettings/AudioManager.asset
          if ! grep -qx "  m_DisableAudio: 0" "$asset"; then
            echo "::error file=$asset::m_DisableAudio が出荷値（0）ではありません。macOS ビルドが中断して ON のまま残った可能性があります。0 に直してコミットしてください（Android ビルドが無音になります）"
            grep -n "m_DisableAudio" "$asset" || true
            exit 1
          fi

  unity-macos-identity-settings:
    name: Unity の一度きりの設定が出荷値
    runs-on: ubuntu-latest

    # ここで守る設定は、どれも「二度と自動で再表明されない」種類の設定で、
    # unity-audio-settings（上のジョブ）と同じ理由でここが最後の砦になる。
    #   - macAppStoreCategory は ProjectSettings.asset を手で編集した値そのもの。
    #     何かが定期的に書き直すわけではないので、Inspector で Mac App Store Category を
    #     触る・Player Settings をリセットする・Unity のバージョン上げで再シリアライズされる、
    #     のいずれでも黙って既定値（Game Mode 扱いのロケット）に戻りうる
    #   - m_BuildTargetIcons を書くのは ./scripts/build.sh が呼ばない一回きりのツール
    #     （IconSettings.FixAll）だけ。実行し忘れたままコミットすると、Info.plist は
    #     アイコンを指すのに実体が無い .app が出荷される
    #   - m_BuildTargetPlatformIcons（Android の Adaptive）も IconSettings.FixAll だけが書く。
    #     空に戻ると、ランチャーで白い丸に縮んだアイコンに黙って戻る
    #   - OpenXR の Offscreen Rendering Only を切るのも AndroidPlayerSettings.FixAll だけ。
    #     アセットを作り直すとパッケージの既定（有効）に戻り、XR の無い Android で画面が真っ黒になる。
    #     パッケージの Project Validation はローダーが1つなら合格を返すので捕まらない
    #   - 手元ビルドの版（bundleVersion / versionCode）と署名は、./scripts/build-android.sh と
    #     ./scripts/build.sh の release ビルドがビルドの間だけ書き換えて戻す。中断すると配布用の値や署名設定が
    #     追跡ファイルに残り、以後の手元ビルドが配布した版を名乗るか、署名で失敗する
    # どれもテストにも通常の CI にも引っかからず、実機で気づくまで気づけない
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: macAppStoreCategory が出荷値であること
        working-directory: .
        run: |
          asset=chatter-mascot/ProjectSettings/ProjectSettings.asset
          if ! grep -qx "  macAppStoreCategory: public.app-category.utilities" "$asset"; then
            echo "::error file=$asset::macAppStoreCategory が出荷値ではありません。Inspector での操作や Player Settings のリセットで戻った可能性があります（Game Mode のロケットが復活します）"
            grep -n "macAppStoreCategory" "$asset" || true
            exit 1
          fi

      - name: m_BuildTargetIcons が空でないこと
        working-directory: .
        run: |
          asset=chatter-mascot/ProjectSettings/ProjectSettings.asset
          if grep -qx "  m_BuildTargetIcons: \[\]" "$asset"; then
            echo "::error file=$asset::m_BuildTargetIcons が空です。./scripts/run.sh ChatterMascot.EditorTools.IconSettings.FixAll を実行し直してコミットしてください（アイコンの無い .app が出荷されます）"
            grep -n "m_BuildTargetIcons" "$asset" || true
            exit 1
          fi

      - name: Android の Adaptive アイコンが空でないこと
        working-directory: .
        run: |
          asset=chatter-mascot/ProjectSettings/ProjectSettings.asset
          # m_BuildTargetPlatformIcons の Android ブロックだけを見る。m_Kind: 2 が Adaptive
          result=$(awk '
            /^  m_BuildTargetPlatformIcons:/ { sec = 1; next }
            sec && /^  [A-Za-z]/ { sec = 0 }
            !sec { next }
            /^  - m_BuildTarget:/ { android = ($0 ~ /m_BuildTarget: Android$/); next }
            !android { next }
            /^    - m_Textures:/ { filled = ($0 !~ /\[\]/); next }
            /^      - \{fileID:/ { filled = 1; next }
            /^      m_Kind: 2$/ { total++; if (!filled) empty++ }
            END { printf "%d %d", total, empty }
          ' "$asset")
          if [ "${result% *}" -eq 0 ] || [ "${result#* }" -gt 0 ]; then
            echo "::error file=$asset::Android の Adaptive アイコンが無い、または空です（total empty = ${result}）。./scripts/run.sh ChatterMascot.EditorTools.IconSettings.FixAll を実行し直してコミットしてください（ランチャーで白い丸に縮んだアイコンになります）"
            exit 1
          fi

      - name: OpenXR の Offscreen Rendering Only が無効であること
        working-directory: .
        run: |
          asset="chatter-mascot/Assets/XR/Settings/OpenXR Editor Settings.asset"
          if ! grep -qx "  m_vulkanOffscreenSwapchainNoMainDisplay: 0" "$asset"; then
            echo "::error file=$asset::Offscreen Rendering Only (Vulkan) が無効になっていません。./scripts/run.sh ChatterMascot.EditorTools.AndroidPlayerSettings.FixAll を実行し直してコミットしてください（XR の無い Android で画面が真っ黒になります）"
            grep -n "m_vulkanOffscreenSwapchainNoMainDisplay" "$asset" || true
            exit 1
          fi

      - name: 手元ビルドの版と署名が出荷値であること
        working-directory: .
        run: |
          asset=chatter-mascot/ProjectSettings/ProjectSettings.asset
          for line in "  bundleVersion: 0.0.0-dev" "  AndroidBundleVersionCode: 1" "  androidUseCustomKeystore: 0" "  AndroidKeystoreName: "; do
            if ! grep -qxF -- "$line" "$asset"; then
              echo "::error file=$asset::「${line}」が出荷値のままではありません。release ビルドが中断して版や署名が残ったか、版を手で書き換えた可能性があります。元に戻してコミットしてください（版はタグから決まります）"
              grep -n "${line%%:*}:" "$asset" || true
              exit 1
            fi
          done
