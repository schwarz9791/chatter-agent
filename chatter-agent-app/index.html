<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatterAgent</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f7;
        --card: #ffffff;
        --text: #1d1d1f;
        --sub: #6e6e73;
        --line: #e5e5ea;
        --accent: #0a84ff;
        --warn: #d70015;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1e;
          --card: #2a2a2c;
          --text: #f5f5f7;
          --sub: #98989d;
          --line: #3a3a3c;
          --warn: #ff6961;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", system-ui, sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
      }
      h2 {
        margin: 22px 0 6px 4px;
        font-size: 12px;
        font-weight: 600;
        color: var(--sub);
      }
      section {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .row {
        padding: 9px 14px;
        border-top: 1px solid var(--line);
      }
      .row:first-child {
        border-top: 0;
      }
      .line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .ctl {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .note {
        margin-top: 2px;
        font-size: 11px;
        color: var(--sub);
      }
      .note.warn {
        color: var(--warn);
      }
      .note:empty {
        display: none;
      }
      select,
      button {
        font: inherit;
      }
      input[type="range"] {
        width: 160px;
        accent-color: var(--accent);
      }
      .val {
        min-width: 3.5em;
        text-align: right;
        color: var(--sub);
        font-variant-numeric: tabular-nums;
      }
      .mods label {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        margin-right: 6px;
      }
      :disabled {
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
