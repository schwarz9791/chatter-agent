[package]
name = "chatter-agent-app"
version = "0.0.0-dev"
description = "chatter-agent-server をメニューバーから面倒を見る親アプリ"
license = "Apache-2.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
libc = "0.2"
sys-locale = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "system-proxy"] }
minisign-verify = "0.3.0"
base64 = "0.22"
semver = "1.0.28"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
ring = { version = "0.17", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "objc2", "CFArray", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-core-video", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMSync", "CMTime"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "objc2", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media", "SCContentSharingPicker", "SCError", "SCShareableContent", "SCStream"] }
objc2-video-toolbox = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-core-media", "objc2-core-video", "VTCompressionProperties", "VTCompressionSession", "VTErrors", "VTSession"] }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
