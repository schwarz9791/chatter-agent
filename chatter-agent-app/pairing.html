<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatterAgent</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f7;
        --card: #ffffff;
        --text: #1d1d1f;
        --sub: #6e6e73;
        --line: #e5e5ea;
        --accent: #0a84ff;
        --warn: #d70015;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1e;
          --card: #2a2a2c;
          --text: #f5f5f7;
          --sub: #98989d;
          --line: #3a3a3c;
          --warn: #ff6961;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", system-ui, sans-serif;
        text-align: center;
      }
      main {
        padding: 20px 14px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .pin {
        margin: 0;
        font: 600 56px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.25em;
        /* letter-spacing は末尾にも付くので、中央から寄らないよう打ち消す。 */
        padding-left: 0.25em;
      }
      .status {
        margin: 8px 0 0;
        font-size: 15px;
      }
      .sub {
        color: var(--sub);
      }
      .error {
        color: var(--warn);
      }
      .guide {
        margin: 14px 0 0;
        color: var(--sub);
      }
      button {
        margin-top: 12px;
        padding: 5px 14px;
        font: inherit;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 6px;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="pin" id="pin" hidden></p>
      <p class="status" id="status"></p>
      <button id="reissue" hidden></button>
      <p class="guide" id="guide"></p>
    </main>
    <script type="module" src="/src/pairing.ts"></script>
  </body>
</html>
