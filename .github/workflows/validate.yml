name: Validate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# 既定のトークン権限は広いので、必要な分だけに絞る
permissions:
  contents: read

# 同じブランチへ続けて push したら、古い実行は打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: core

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run oxlint
        run: npm run lint

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  bundle:
    name: Bundle is up to date
    runs-on: ubuntu-latest

    # plugin/bin/ のバンドルは git にコミットしている（/plugin install だけで完結させるため）。
    # ソースだけ直してビルドし忘れると、hook が古いコードを実行し続けて気づきにくい。
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify committed bundle matches source
        run: |
          if ! git diff --exit-code -- ../plugin/bin; then
            echo "::error::plugin/bin/ のバンドルがソースと一致しません。core/ で npm run build を実行してコミットしてください。"
            exit 1
          fi
          # git diff は未追跡ファイルを見ない。clean: false なので、将来チャンクや
          # sourcemap が増えても無検査で紛れ込む。porcelain で追跡外も拾う
          untracked="$(git status --porcelain -- ../plugin/bin)"
          if [ -n "$untracked" ]; then
            echo "::error::plugin/bin/ に未コミットのファイルがあります:"
            echo "$untracked"
            exit 1
          fi

      # バンドラがヘッダを落としていても上の検証は通ってしまう（ソースとは一致するため）。
      # 配布物そのものに帰属表示と改変告知があることを直接確かめる（Apache-2.0 §4(b)/(d)）
      - name: Verify attribution survives bundling
        run: |
          bundle=../plugin/bin/chatter-agent-speak.mjs
          for needle in "kazakago" "Modified for chatter-agent" "Apache License"; do
            if ! grep -qF "$needle" "$bundle"; then
              echo "::error::配布バンドルに \"$needle\" がありません。tsdown.config.ts の banner を確認してください。"
              exit 1
            fi
          done
          for f in ../plugin/LICENSE ../plugin/NOTICE; do
            if [ ! -f "$f" ]; then
              echo "::error::$f がありません。/plugin install の配布物に含める必要があります。"
              exit 1
            fi
          done

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

  verify:
    name: Verify (phase A / B)
    runs-on: ubuntu-latest

    # phase-a / phase-b はどちらもバンドル（plugin/bin/ と core/dist/）を実行するので
    # npm run build が先に要る。phase-b は 127.0.0.1:18570 に bind するだけなので CI でも動く
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify phase A (spool → speech.jsonl)
        run: npm run verify:phase-a

      - name: Verify phase B (delivery queue → WebSocket)
        run: npm run verify:phase-b

      # 合成エンジンはスタブ HTTP に差し替わるので AivisSpeech は要らない
      - name: Verify TTS (server の合成と GET /audio/)
        run: npm run verify:tts

      # 音声は上と同じくスタブ、再生コマンドは fake-player.mjs に差し替わるので、
      # AivisSpeech もオーディオデバイスも要らない
      - name: Verify player (WebSocket → 音声取得 → 再生 → ack)
        run: npm run verify:player

  unity-audio-settings:
    name: Unity のオーディオ設定が出荷値
    runs-on: ubuntu-latest

    # scripts/build.sh は macOS ビルドのあいだだけ Disable Unity Audio を ON にして戻す
    # （Unity 内蔵オーディオが有効なままだと、AudioSource を1つも鳴らさなくても
    # 出力デバイスを掴み続けるため）。BuildScript の finally と build.sh の trap で戻しているが、
    # SIGKILL はどちらでも拾えない。ON が残ったままコミットされると、次の Android ビルドは
    # Unity 内蔵オーディオごと無効 → AudioClipPlayer が鳴らない → isPlaying が即 false →
    # 全部 ack されてサーバーのキューから消える。ここが最後の砦。
    steps:
      # ★ **lfs: true は要らない。** #56 で Assets/StreamingAssets/ に LFS 追跡の
      # .vrm / .vrma が入ったが、このジョブが読むのは YAML の .asset だけで、
      # LFS のポインタファイルのままでも grep は成立する。
      # **Unity Editor を起動するジョブ（#54）を足すときは lfs: true が要る** ——
      # ポインタファイルのままだとモデルの読み込みが必ず失敗する。
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: m_DisableAudio が出荷値（0）であること
        working-directory: .
        run: |
          asset=apps/chatter-mascot/ProjectSettings/AudioManager.asset
          if ! grep -qx "  m_DisableAudio: 0" "$asset"; then
            echo "::error file=$asset::m_DisableAudio が出荷値（0）ではありません。macOS ビルドが中断して ON のまま残った可能性があります。0 に直してコミットしてください（Android ビルドが無音になります）"
            grep -n "m_DisableAudio" "$asset" || true
            exit 1
          fi

  unity-macos-identity-settings:
    name: Unity の macOS アイコン / カテゴリ設定が出荷値
    runs-on: ubuntu-latest

    # #93 で直した2値は、どちらも「二度と自動で再表明されない」種類の設定で、
    # unity-audio-settings（上のジョブ）と同じ理由でここが最後の砦になる。
    #   - macAppStoreCategory は ProjectSettings.asset を手で編集した値そのもの。
    #     何かが定期的に書き直すわけではないので、Inspector で Mac App Store Category を
    #     触る・Player Settings をリセットする・Unity のバージョン上げで再シリアライズされる、
    #     のいずれでも黙って既定値（Game Mode 扱いのロケット）に戻りうる
    #   - m_BuildTargetIcons を書くのは ./scripts/build.sh が呼ばない一回きりのツール
    #     （IconSettings.FixAll）だけ。実行し忘れたままコミットすると、Info.plist は
    #     アイコンを指すのに実体が無い .app が出荷される
    # どちらもテストにも通常の CI にも引っかからず、実機で気づくまで気づけない
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: macAppStoreCategory が出荷値であること
        working-directory: .
        run: |
          asset=apps/chatter-mascot/ProjectSettings/ProjectSettings.asset
          if ! grep -qx "  macAppStoreCategory: public.app-category.utilities" "$asset"; then
            echo "::error file=$asset::macAppStoreCategory が出荷値ではありません。Inspector での操作や Player Settings のリセットで戻った可能性があります（Game Mode のロケットが復活します）"
            grep -n "macAppStoreCategory" "$asset" || true
            exit 1
          fi

      - name: m_BuildTargetIcons が空でないこと
        working-directory: .
        run: |
          asset=apps/chatter-mascot/ProjectSettings/ProjectSettings.asset
          if grep -qx "  m_BuildTargetIcons: \[\]" "$asset"; then
            echo "::error file=$asset::m_BuildTargetIcons が空です。./scripts/run.sh ChatterMascot.EditorTools.IconSettings.FixAll を実行し直してコミットしてください（アイコンの無い .app が出荷されます）"
            grep -n "m_BuildTargetIcons" "$asset" || true
            exit 1
          fi

      # ★ *.png は Git LFS 追跡。 lfs: true にすると vita.vrm まで毎回落ちるので、
      # 検査に要る2枚だけを取る（→ docs/mascot.md「トレイ画像を差し替えるとき」）
      - name: トレイ PNG だけ LFS から取得
        working-directory: .
        run: git lfs pull --include="apps/chatter-mascot/Assets/StreamingAssets/trayTemplate*.png"

      # ★ 上の取得が黙って 0 件で終わっても「素通りで緑」にしないこと。
      # ポインタファイルのままなら PNG シグネチャで落ちる
      - name: トレイ PNG の寸法とメタデータチャンク
        working-directory: .
        run: |
          python3 <<'PY'
          import glob
          import os
          import struct
          import sys

          PATTERN = "apps/chatter-mascot/Assets/StreamingAssets/trayTemplate*.png"
          SIGNATURE = bytes([0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A])

          # ★ 弾きたいのは編集ツールが埋めるメタデータであって、画像形式ではない
          ALLOWED = {b"IHDR", b"PLTE", b"tRNS", b"IDAT", b"IEND"}

          # ★★ @1x と @2x は 2 枚セット（理由は CMLoadTemplateImage のコメント）
          EXPECTED = {"trayTemplate.png": (16, 16), "trayTemplate@2x.png": (32, 32)}

          paths = sorted(glob.glob(PATTERN))
          if not paths:
              print(f"::error::{PATTERN} に一致する PNG がありません")
              sys.exit(1)

          failed = False

          # ★ 0 件だけでなく「片方が消えた」も捕まえること（増えた側は下のループ）
          missing = sorted(set(EXPECTED) - {os.path.basename(p) for p in paths})
          if missing:
              print(f"::error::トレイ画像が足りません: {', '.join(missing)}。@1x と @2x は 2 枚セットです")
              failed = True

          for path in paths:
              name = os.path.basename(path)
              data = open(path, "rb").read()
              if data[:8] != SIGNATURE:
                  print(
                      f"::error file={path}::PNG シグネチャが一致しません。Git LFS のポインタファイルの"
                      "ままの疑いがあります（前段の git lfs pull のステップを確認してください）"
                  )
                  failed = True
                  continue

              # ★ 期待値を書き忘れたまま素通りさせない。 @3x を足すときはここも足すこと
              if name not in EXPECTED:
                  print(
                      f"::error file={path}::{name} の寸法が EXPECTED に書かれていません"
                  )
                  failed = True
                  continue

              offset = 8
              unexpected = []
              size = None
              while offset + 8 <= len(data):
                  length = struct.unpack(">I", data[offset:offset + 4])[0]
                  chunk_type = data[offset + 4:offset + 8]
                  if chunk_type == b"IHDR":
                      # ★ IHDR は非圧縮なので、幅と高さはバイトを読むだけで取れる
                      #   （デコーダは要らない）。データ部の先頭がそれぞれ 4 バイト
                      size = struct.unpack(">II", data[offset + 8:offset + 16])
                  elif chunk_type not in ALLOWED:
                      unexpected.append(chunk_type.decode("ascii", errors="replace"))
                  offset += 12 + length
                  if chunk_type == b"IEND":
                      break

              if size != EXPECTED[name]:
                  want, got = EXPECTED[name], size
                  print(
                      f"::error file={path}::寸法が {want[0]}x{want[1]} ではありません（実際は {got}）。"
                      "@1x と @2x は 2 枚セットです（docs/mascot.md「トレイ画像を差し替えるとき」）"
                  )
                  failed = True

              if unexpected:
                  print(
                      f"::error file={path}::許可していない PNG チャンクがあります: {', '.join(unexpected)}。"
                      "編集ツールのメタデータの疑い（docs/mascot.md「トレイ画像を差し替えるとき」）"
                  )
                  failed = True

          if failed:
              sys.exit(1)
          PY
